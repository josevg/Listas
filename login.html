<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar ou Criar Conta — Mapa de Conversas</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-badge">TERAPEUTAS</span>
        <span>Mapa de Conversas</span>
      </a>
      <div class="topbar-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">Página inicial</a>
      </div>
    </div>
  </header>

  <main class="container page-main">
    <div class="card auth-box">
      <div class="tabs" style="margin-bottom: 16px;">
        <button type="button" id="tabLogin" class="tab-btn active" style="flex: 1;">Entrar</button>
        <button type="button" id="tabCadastro" class="tab-btn" style="flex: 1;">Criar conta</button>
      </div>

      <div id="alertaAuth" class="alert hidden"></div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="formLogin">
        <h1 class="section-title">Acessar sua conta</h1>
        <p class="section-subtitle">Entre com seu e-mail e senha cadastrados.</p>

        <div class="field" style="margin-bottom: 12px;">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" type="email" class="input" required placeholder="seu@email.com" />
        </div>

        <div class="field" style="margin-bottom: 14px;">
          <label for="loginSenha">Senha</label>
          <input id="loginSenha" type="password" class="input" required placeholder="Sua senha" />
        </div>

        <button type="submit" id="btnEntrar" class="btn btn-primary" style="width: 100%;">
          Entrar no painel
        </button>

        <div style="margin-top: 14px; text-align: center;">
          <a href="recuperar-senha.html">Esqueci minha senha</a>
        </div>
      </form>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="formCadastro" class="hidden">
        <h1 class="section-title">Criar conta de terapeuta</h1>
        <p class="section-subtitle">Preencha seus dados para registrar seu acesso.</p>

        <div class="field" style="margin-bottom: 12px;">
          <label for="cadNome">Nome completo</label>
          <input id="cadNome" type="text" class="input" required placeholder="Ex.: Ana Paula Souza" />
        </div>

        <div class="field" style="margin-bottom: 12px;">
          <label for="cadEmail">E-mail</label>
          <input id="cadEmail" type="email" class="input" required placeholder="seu@email.com" />
        </div>

        <div class="field" style="margin-bottom: 12px;">
          <label for="cadWhatsapp">WhatsApp (com DDD)</label>
          <input id="cadWhatsapp" type="tel" class="input" required placeholder="Ex.: 61999998888" />
        </div>

        <div class="field" style="margin-bottom: 14px;">
          <label for="cadSenha">Senha (mínimo 6 caracteres)</label>
          <input id="cadSenha" type="password" class="input" minlength="6" required placeholder="Crie uma senha" />
        </div>

        <button type="submit" id="btnCadastrar" class="btn btn-primary" style="width: 100%;">
          Cadastrar e ir para o painel
        </button>
      </form>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const tabLogin = document.getElementById("tabLogin");
    const tabCadastro = document.getElementById("tabCadastro");
    const formLogin = document.getElementById("formLogin");
    const formCadastro = document.getElementById("formCadastro");
    const alertaAuth = document.getElementById("alertaAuth");

    function mostrarAlerta(tipo, msg) {
      alertaAuth.className = `alert alert-${tipo}`;
      alertaAuth.textContent = msg;
      alertaAuth.classList.remove("hidden");
    }

    function esconderAlerta() {
      alertaAuth.classList.add("hidden");
    }

    function ativarAba(aba) {
      esconderAlerta();
      if (aba === "cadastro") {
        tabCadastro.classList.add("active");
        tabLogin.classList.remove("active");
        formCadastro.classList.remove("hidden");
        formLogin.classList.add("hidden");
      } else {
        tabLogin.classList.add("active");
        tabCadastro.classList.remove("active");
        formLogin.classList.remove("hidden");
        formCadastro.classList.add("hidden");
      }
    }

    tabLogin.addEventListener("click", () => ativarAba("login"));
    tabCadastro.addEventListener("click", () => ativarAba("cadastro"));

    const params = new URLSearchParams(window.location.search);
    if (params.get("modo") === "cadastro") {
      ativarAba("cadastro");
    }

    // Se já estiver logado, redireciona direto para o painel correspondente
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const perfil = await AuthService.obterPerfilUsuario(session.user.id);
        if (perfil) {
          window.location.href = perfil.role === "admin" ? "admin.html" : "app.html";
        }
      }
    })();

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      esconderAlerta();
      const btn = document.getElementById("btnEntrar");
      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {
        await AuthService.login(
          document.getElementById("loginEmail").value,
          document.getElementById("loginSenha").value
        );
      } catch (err) {
        mostrarAlerta("danger", err.message || "Não foi possível entrar. Verifique e-mail e senha.");
        btn.disabled = false;
        btn.textContent = "Entrar no painel";
      }
    });

    formCadastro.addEventListener("submit", async (e) => {
      e.preventDefault();
      esconderAlerta();
      const btn = document.getElementById("btnCadastrar");
      btn.disabled = true;
      btn.textContent = "Criando conta...";

      try {
        const res = await AuthService.cadastrar({
          nome: document.getElementById("cadNome").value,
          email: document.getElementById("cadEmail").value,
          whatsapp: document.getElementById("cadWhatsapp").value,
          password: document.getElementById("cadSenha").value
        });

        if (!res.redirecionado) {
          mostrarAlerta(
            "success",
            "Cadastro realizado! Se o envio de confirmação de e-mail estiver ativo no seu projeto, verifique sua caixa de entrada ou faça login em seguida."
          );
          btn.disabled = false;
          btn.textContent = "Cadastrar e ir para o painel";
        }
      } catch (err) {
        mostrarAlerta("danger", err.message || "Erro ao criar conta.");
        btn.disabled = false;
        btn.textContent = "Cadastrar e ir para o painel";
      }
    });
  </script>
</body>
</html>
